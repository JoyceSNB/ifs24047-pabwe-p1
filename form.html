<main>
<h1>Form Pendaftaran Akun</h1>

<form>
<fieldset>
<legend>Daftar Akun</legend>

<p><label for="nama_lengkap">Nama Lengkap:</label> <input type="text" name="nama_lengkap" id="nama_lengkap"></p>

<p>Jenis Kelamin:
<input type="radio" name="jenis_kelamin" id="lk"><label for="lk">Laki-Laki</label>
<input type="radio" name="jenis_kelamin" id="pr"><label for="pr">Perempuan</label>
</p>

<p><label for="tempat_lahir">Tempat Lahir:</label> <input type="text" name="tempat_lahir" id="tempat_lahir"></p>

<p><label for="tanggal_lahir">Tanggal Lahir:</label> <input type="date" name="tanggal_lahir" id="tanggal_lahir"></p>

<p><label for="agama">Agama:</label>
<select name="agama" id="agama">
<option value="">--- Pilih Agama ---</option>
<option value="islam">Islam</option>
<option value="katolik">Katolik</option>
<option value="protestan">Protestan</option>
<option value="hindu">Hindu</option>
<option value="buddha">Buddha</option>
<option value="konghucu">Konghucu</option>
</select>
</p>

<p>Hobi:
<input type="checkbox" name="hobi" value="olahraga" id="h1"><label for="h1">Olahraga</label>
<input type="checkbox" name="hobi" value="membaca" id="h2"><label for="h2">Membaca</label>
<input type="checkbox" name="hobi" value="ngoding" id="h3"><label for="h3">Ngoding</label>
</p>

<p><label for="password">Password:</label> <input type="password" name="password" id="password"></p>

<p><input type="checkbox" name="persetujuan" id="setuju"><label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label></p>

<p><input type="reset" value="Reset"> <input type="submit" value="Submit"></p>

</fieldset>
</form>
</main>

</body>
</html>
